name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - run: go test ./...
        env:
          CGO_ENABLED: '0'

  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: xet
          POSTGRES_PASSWORD: xet
          POSTGRES_DB: xet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xet -d xet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      XET_POSTGRES_INTEGRATION: '1'
      XET_POSTGRES_DSN: postgres://xet:xet@127.0.0.1:5432/xet?sslmode=disable
      XET_S3_INTEGRATION: '1'
      XET_S3_ENDPOINT: http://127.0.0.1:9000
      XET_S3_BUCKET: xet-go-test
      XET_S3_ACCESS_KEY: xetminio
      XET_S3_SECRET_KEY: xetminio-secret
      XET_S3_REGION: us-east-1
      XET_S3_PATH_STYLE: 'true'
      XET_S3_CREATE_BUCKET: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - name: Start pinned MinIO
        run: |
          docker run --detach --rm --name xet-go-minio \
            --publish 127.0.0.1:9000:9000 \
            --env MINIO_ROOT_USER="$XET_S3_ACCESS_KEY" \
            --env MINIO_ROOT_PASSWORD="$XET_S3_SECRET_KEY" \
            quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e \
            server /data --address :9000
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:9000/minio/health/cluster >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          docker logs xet-go-minio
          exit 1
      - run: go test -race ./...
      - run: go vet ./...
      - run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2 run ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - run: ./conformance/check-coverage.sh
      - run: XET_FUZZ_TIME=2s ./conformance/fuzz-smoke.sh
      - run: ./conformance/cross-compile.sh
      - name: Stop MinIO
        if: always()
        run: docker rm --force xet-go-minio || true

  official-conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - uses: actions/cache@v4
        with:
          path: |
            .oracle/xet-core
            .cache/xet-spec-reference-files
          key: xet-official-${{ runner.os }}-${{ hashFiles('conformance/reference-manifest.json', 'conformance/rust-oracle/main.rs') }}
      - run: rustup toolchain install 1.95.0 --profile minimal
      - run: ./conformance/run-official-conformance.sh
      - run: XET_PERF_ITERATIONS=1 XET_PERF_SAMPLES=1 ./conformance/compare-performance.sh
